[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-anomaly"
version = "0.2.0"
description = "PMU window features and Isolation Forest anomaly detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pyarrow>=14", "plotly>=5.18"]

[project.optional-dependencies]
test = ["pytest>=8"]
shap = ["shap>=0.46", "matplotlib>=3.7"]
gpu = ["torch>=2.5", "cuml-cu12>=25.2; platform_system == 'Linux'"]
export = ["kaleido>=1"]

[project.scripts]
spectral-anomaly = "spectral_anomaly.cli:main"
spectral-anomaly-shap = "spectral_anomaly.shap_analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
